description: >-
  Cloudmersive provides a portfolio of utility APIs covering virus and malware scanning, document conversion, OCR, image
  recognition, NLP, validation, security threat detection (spam, phishing, fraud, DLP, CDR), speech, video, barcode,
  currency, and data integration. Each API is documented with a Swagger 2.0 / OpenAPI specification, has SDKs in
  multiple languages, and is consumable on api.cloudmersive.com behind an API key (`Apikey` header).
